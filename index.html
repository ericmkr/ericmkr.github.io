<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio — Victor Eric MOUKOURI</title>

  <!-- CSS -->
  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="container header-left">

      <!-- LOGO -->
      <a class="logo" href="index.html">
        <img src="assets/img/Logo mkr.jpg" alt="logo">
      </a>

      <!-- RIGHT SIDE -->
      <div class="header-right">

        <!-- NAVBAR -->
        <nav class="main-nav">
          <ul class="navbar-nav">
            <li class="navbar-item"><a href="index.html">Home</a></li>
            <li class="navbar-item"><a href="about.html">About</a></li>
            <li class="navbar-item"><a href="portfolio.html">Portfolio</a></li>
            <li class="navbar-item"><a href="#contact">Contact</a></li>
          </ul>
        </nav>

        <!-- BUTTON -->
        <a class="btn-timing" href="#">⏱ Timing</a>

      </div>
    </div>
  </header>

  <!-- MAIN -->
  <main>

    <!-- HERO -->
    <section class="hero">
      <div class="container">
        <img src="assets/img/mkr.jpg" class="hero-img" alt="profile">
        <h1>Web Designer & Developer</h1>
        <p class="lead">
          Young African artist specializing in web and mobile interface design.
        </p>
      </div>
    </section>

    <!-- PROJECTS -->
    <section class="container">
      <h2>Projects</h2>

      <div class="grid">

        <!-- CARD 1 -->
        <div class="card">
          <img src="assets/img/FlowTrack - HQ Wireframes.png" alt="FlowTrack">
          <h3>FlowTrack</h3>
          <p>Mobile UX design project</p>
        </div>

        <!-- CARD 2 -->
        <div class="card">
          <img src="assets/img/www-icon-vector-website-logo.png" alt="World Wide Wall">
          <h3>World Wide Wall</h3>
          <p>Website mockup</p>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="site-footer" id="contact">
    <div class="container">

      <h3>Contact</h3>

      <form>
        <input type="text" placeholder="Enter your name" required>
        <input type="email" placeholder="Enter your email" required>
        <textarea rows="3" placeholder="Message"></textarea>
        <button type="submit" class="btn">Submit</button>
      </form>

      <p>© MKR Gang</p>

    </div>
  </footer>

</body>
</html>
